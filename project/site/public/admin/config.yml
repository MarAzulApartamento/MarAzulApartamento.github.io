# Sveltia CMS configuration for Apartamento Mar Azul.
# Drives the visual editor at /admin/.
#
# Stefania uses the editor to manage all owner-curated content:
# reviews, FAQs, all 7 language copies of the site, and all media
# (gallery photos, hero photo, About video, owner photo).
#
# Repo backend: GitHub. Sveltia commits to the redesign/v2 branch via
# GitHub OAuth. Auth proxy is a Cloudflare Worker at cms-auth/.

backend:
  name: github
  repo: MarAzulApartamento/MarAzulApartamento.github.io
  branch: redesign/v2
  base_url: https://marazul-cms-auth.marazulapartamento.workers.dev
  auth_endpoint: auth

site_url: https://apartamentomarazul.com
display_url: https://apartamentomarazul.com
locale: en

media_folder: project/site/public/photos
public_folder: /photos

# i18n at the CMS level — Sveltia's per-collection i18n is unused here
# because we expose each language's JSON file as its own editable file
# under Site copy, which gives Stefania a clearer mental model.
i18n:
  structure: multiple_files
  locales: [en, pt, es, it, de, nl, fr]
  default_locale: en

# ---------------------------------------------------------------
# Reusable field schema for each language's i18n JSON file.
# Defined once at the top via a YAML anchor (&i18n_fields), then
# referenced (*i18n_fields) by every file in the Site copy collection.
# ---------------------------------------------------------------
_anchors:
  i18n_fields: &i18n_fields
    - name: common
      label: 'Shared UI labels'
      widget: object
      collapsed: true
      fields:
        - { name: whatsappCta, label: 'WhatsApp button label', widget: string }
        - { name: whatsappMicro, label: 'WhatsApp response-time microcopy', widget: string, hint: 'Always shown next to WhatsApp CTA. Sets expectations.' }
        - { name: whatsappFallback, label: 'WhatsApp fallback prompt (calendar)', widget: string }
        - { name: bookDirect, label: 'Book direct (button)', widget: string }
        - { name: bookDirectArrow, label: 'Book direct (with arrow)', widget: string }
        - { name: checkAvailability, label: 'Check availability (hero CTA)', widget: string }
        - { name: continueToBooking, label: 'Continue to booking (calendar CTA)', widget: string }
        - { name: from, label: 'Price prefix (e.g. From)', widget: string }
        - { name: perNight, label: 'Price suffix (e.g. per night)', widget: string }
        - { name: minStayShort, label: 'Min stay short (use {n} for the number)', widget: string }
    - name: topBar
      label: 'Top bar'
      widget: object
      collapsed: true
      fields:
        - { name: siteNameAria, label: 'Site name (screen readers)', widget: string }
    - name: home
      label: 'Homepage SEO'
      widget: object
      fields:
        - { name: metaTitle, label: 'SEO title (Google search result heading)', widget: string }
        - { name: metaDescription, label: 'SEO description (use {priceFrom} for price)', widget: text }
    - name: hero
      label: 'Hero (top of homepage)'
      widget: object
      fields:
        - { name: eyebrow, label: 'Eyebrow (small label above headline)', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: subtitle, label: 'Subtitle', widget: string }
    - name: trustStrip
      label: 'Trust strip (under hero)'
      widget: object
      collapsed: true
      fields:
        - { name: ratingLabel, label: 'Rating label (use {rating} and {count})', widget: string }
        - { name: openSince, label: 'Open since', widget: string }
        - { name: languages, label: 'Languages spoken', widget: string }
    - name: factsGrid
      label: 'Facts grid (At a glance)'
      widget: object
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - name: facts
          label: 'Facts (10 items recommended)'
          widget: list
          summary: '{{fields.label}}: {{fields.value}}'
          fields:
            - { name: label, label: 'Label', widget: string }
            - { name: value, label: 'Value', widget: string }
            - { name: neg, label: 'Style as negative (crossed-out, italic)', widget: boolean, default: false }
    - name: about
      label: 'About (with video)'
      widget: object
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: body, label: 'Body paragraph', widget: text }
        - { name: hostedBy, label: 'Hosted by line', widget: string }
    - name: gallery
      label: 'Gallery'
      widget: object
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: openLabel, label: 'Aria label prefix for photos (accessibility)', widget: string }
        - name: captions
          label: 'Photo captions (one per gallery photo)'
          widget: list
          summary: '{{fields.id}} → {{fields.caption}}'
          hint: 'IDs must match gallery items in Media (Site media → Gallery items).'
          fields:
            - { name: id, label: 'Photo ID (e.g. marazul-01)', widget: string }
            - { name: caption, label: 'Caption', widget: string }
    - name: perks
      label: 'Direct booking band'
      widget: object
      hint: 'Short band that says direct booking is the best rate.'
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: lede, label: 'Sub line', widget: text }
    - name: location
      label: 'Location'
      widget: object
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: mapLabel, label: 'Map aria-label (accessibility)', widget: string }
        - { name: mapPlaceholder, label: 'Map placeholder text (until Leaflet ships)', widget: string }
        - name: places
          label: 'Nearby places'
          widget: list
          summary: '{{fields.type}} · {{fields.name}}'
          fields:
            - { name: type, label: 'Type (Beach, Tasca, etc.)', widget: string }
            - { name: name, label: 'Name', widget: string }
            - { name: distance, label: 'Distance (Walking, 10 min walk, etc.)', widget: string }
    - name: reviews
      label: 'Reviews section heading'
      widget: object
      collapsed: true
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
    - name: availability
      label: 'Availability section'
      widget: object
      collapsed: true
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: ledeWithPrice, label: 'Lede (use {priceFrom} and {minStay})', widget: text }
    - name: faq
      label: 'FAQ section heading'
      widget: object
      collapsed: true
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
    - name: finalCta
      label: 'Final CTA section'
      widget: object
      collapsed: true
      fields:
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
    - name: stickyCta
      label: 'Sticky CTA (bottom bar)'
      widget: object
      collapsed: true
      fields:
        - { name: priceLabel, label: 'Price label (use {priceFrom})', widget: string }
        - { name: meta, label: 'Meta tagline', widget: string }
    - name: calendarPicker
      label: 'Calendar picker UI'
      widget: object
      collapsed: true
      hint: 'Translations for the date-picker. Most rarely change.'
      fields:
        - { name: pickHeadline, label: 'Pick check-in headline', widget: string }
        - { name: pickMeta, label: 'Pick meta (use {minStay})', widget: string }
        - { name: pickMetaLive, label: 'Pick meta with live availability (use {minStay})', widget: string }
        - { name: checkInPrefix, label: 'Check-in prefix', widget: string }
        - { name: checkInPickout, label: 'After check-in selected (use {minStay})', widget: string }
        - { name: nightSingular, label: 'Night (singular)', widget: string }
        - { name: nightsLabel, label: 'Nights (plural)', widget: string }
        - { name: totalLabelTemplate, label: 'Total label (use {total} and {ppn})', widget: string }
        - { name: minStayWarning, label: 'Min stay warning (use {minStay})', widget: string }
        - { name: blockedError, label: 'Blocked range error', widget: string }
        - { name: clearDates, label: 'Clear dates', widget: string }
        - { name: navPrevious, label: 'Previous (button)', widget: string }
        - { name: navNext, label: 'Next (button)', widget: string }
        - { name: navAriaPrevious, label: 'Previous (aria)', widget: string }
        - { name: navAriaNext, label: 'Next (aria)', widget: string }
        - { name: datesEnRoute, label: 'Dates en-route (legacy, mirror of checkInPickout)', widget: string }
        - { name: minNights, label: 'Min nights singular (use {nights}, {minStay})', widget: string }
        - { name: minNightsPlural, label: 'Min nights plural (use {nights}, {minStay})', widget: string }
    - name: footer
      label: 'Footer'
      widget: object
      collapsed: true
      fields:
        - { name: languagesHeading, label: 'Languages heading', widget: string }
        - { name: legalHeading, label: 'Legal heading', widget: string }
        - { name: legalPrivacy, label: 'Privacy link', widget: string }
        - { name: legalCookies, label: 'Cookies link', widget: string }
        - { name: legalTerms, label: 'Terms link', widget: string }
        - { name: hostedNote, label: 'Hosting note', widget: string }
    - name: bookPage
      label: 'Book page'
      widget: object
      fields:
        - { name: metaTitle, label: 'SEO title', widget: string }
        - { name: metaDescription, label: 'SEO description', widget: text }
        - { name: ctaLabel, label: 'Final CTA button label', widget: string }
        - { name: back, label: 'Back link text', widget: string }
        - { name: eyebrow, label: 'Eyebrow', widget: string }
        - { name: title, label: 'Headline', widget: string }
        - { name: lede, label: 'Lede paragraph', widget: text }
        - name: perksList
          label: 'Perks (under price line)'
          widget: list
          field: { name: item, label: 'Perk', widget: string }
        - { name: perkPriceLine, label: 'Price line (use {priceFrom}, {minStay})', widget: string }
        - { name: helpLine, label: 'Help line above WhatsApp', widget: string }
        - { name: widgetNote, label: 'Booking widget note', widget: text }
    - { name: skipLink, label: 'Skip-to-content link', widget: string }

# ---------------------------------------------------------------
# Collections (what Stefania sees in the sidebar)
# ---------------------------------------------------------------
collections:
  # ---------- Reviews ----------
  - name: reviews
    label: Reviews
    label_singular: Review
    description: |
      Guest reviews displayed on the homepage Reviews section. Up to 5 featured reviews surface; the rest fall back if you don't have 5 featured. Paste the review text exactly as the guest wrote it (verbatim) so attribution stays honest. Tag each one with its source platform so visitors see the mix.
    folder: project/site/src/content/reviews
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{source}}) · {{date}}'
    sortable_fields: [date, source, rating]
    view_filters:
      - { label: Featured, field: featured, pattern: 'true' }
      - { label: Google,   field: source,   pattern: 'Google' }
      - { label: Airbnb,   field: source,   pattern: 'Airbnb' }
      - { label: Booking,  field: source,   pattern: 'Booking.com' }
    fields:
      - { name: name,     label: First name,            widget: string,  required: true }
      - { name: date,     label: Stay date,             widget: string,  hint: 'Month YYYY format, e.g. April 2026' }
      - {
          name: source,
          label: Source platform,
          widget: select,
          options: [Google, Airbnb, "Booking.com", Direct],
          default: Google
        }
      - {
          name: rating,
          label: Stars,
          widget: number,
          min: 1, max: 5, default: 5,
          value_type: int
        }
      - {
          name: language,
          label: Original review language,
          widget: select,
          options: [en, pt, es, it, de, nl, fr],
          default: en
        }
      - {
          name: quote,
          label: Quote (verbatim, do not paraphrase),
          widget: text,
          hint: 'Paste the review text exactly as the guest wrote it. Attribution preserved.'
        }
      - {
          name: featured,
          label: Show on homepage?,
          widget: boolean,
          default: false,
          hint: 'Up to 5 featured reviews surface on the homepage Reviews section.'
        }

  # ---------- FAQs ----------
  - name: faqs
    label: FAQs
    label_singular: FAQ entry
    description: |
      Questions and answers shown on the homepage FAQ section. Keep answers short and specific. Lower display-order numbers appear first. Each entry is tied to a language; create a separate entry per language if you want the question to appear for non-English visitors too. The site automatically generates Google rich-result FAQ schema from these entries, which helps the questions appear directly in search results.
    folder: project/site/src/content/faqs
    create: true
    delete: true
    slug: '{{order}}-{{slug}}'
    summary: '{{order}}. {{question}}'
    sortable_fields: [order]
    fields:
      - { name: question, label: Question,     widget: string,  required: true }
      - {
          name: order,
          label: Display order,
          widget: number,
          min: 1, max: 99, default: 99,
          value_type: int,
          hint: 'Lower numbers appear first on the homepage FAQ.'
        }
      - {
          name: language,
          label: Language,
          widget: select,
          options: [en, pt, es, it, de, nl, fr],
          default: en
        }
      - {
          name: body,
          label: Answer,
          widget: markdown,
          required: true,
          hint: 'Plain prose. Keep answers short and specific.'
        }

  # ---------- Legal pages (Privacy / Cookies / Terms, per locale) ----------
  - name: legal
    label: 'Legal pages'
    label_singular: 'Legal page'
    description: |
      Privacy Notice, Cookie Policy, and Booking Terms. One file per page per language. English is the master — edit there first. Be careful editing these; the wording matters legally. If you're unsure about a change, check with Luis before publishing. The "Last updated" date should be refreshed every time you make a non-trivial edit.
    folder: project/site/src/content/legal
    create: true
    delete: false
    slug: '{{page}}-{{language}}'
    summary: '{{page}} ({{language}}) · updated {{lastUpdated}}'
    sortable_fields: [page, language, lastUpdated]
    view_filters:
      - { label: Privacy, field: page,     pattern: 'privacy' }
      - { label: Cookies, field: page,     pattern: 'cookies' }
      - { label: Terms,   field: page,     pattern: 'terms' }
      - { label: English, field: language, pattern: 'en' }
    fields:
      - { name: page,        label: Page,            widget: select, options: [privacy, cookies, terms], required: true }
      - { name: language,    label: Language,        widget: select, options: [en, pt, es, it, de, nl, fr], required: true, default: en }
      - { name: title,       label: Page title,      widget: string, required: true }
      - { name: description, label: SEO description, widget: text,   required: true }
      - { name: lastUpdated, label: Last updated,    widget: string, required: true, hint: 'Format: YYYY-MM-DD' }
      - { name: body,        label: Body,            widget: markdown, required: true }

  # ---------- Site copy (per-language text) ----------
  - name: site_copy
    label: 'Site copy'
    label_singular: 'Site copy file'
    description: |
      All on-page text in seven languages. The English file is the master — edit there first, then update the other six to keep the site consistent. Some strings include placeholders in curly braces like {priceFrom} or {n}; the site fills these in automatically when the page renders, so leave the placeholders intact and write the surrounding words around them.
    files:
      - name: en
        label: '🇬🇧 English (master)'
        file: project/site/src/i18n/en.json
        format: json
        fields: *i18n_fields
      - name: pt
        label: '🇵🇹 Português'
        file: project/site/src/i18n/pt.json
        format: json
        fields: *i18n_fields
      - name: es
        label: '🇪🇸 Español'
        file: project/site/src/i18n/es.json
        format: json
        fields: *i18n_fields
      - name: it
        label: '🇮🇹 Italiano'
        file: project/site/src/i18n/it.json
        format: json
        fields: *i18n_fields
      - name: de
        label: '🇩🇪 Deutsch'
        file: project/site/src/i18n/de.json
        format: json
        fields: *i18n_fields
      - name: nl
        label: '🇳🇱 Nederlands'
        file: project/site/src/i18n/nl.json
        format: json
        fields: *i18n_fields
      - name: fr
        label: '🇫🇷 Français'
        file: project/site/src/i18n/fr.json
        format: json
        fields: *i18n_fields

  # ---------- Site media (global, not localized) ----------
  - name: site_media
    label: 'Media'
    description: |
      Photos and the About video for the site. Photos are global — they look the same regardless of which language the visitor reads. Photo captions are translated separately under Site copy → Gallery → Captions. To add a new photo to the gallery: upload it via the image picker below, then go to Site copy and add a matching caption with the same photo ID for each language.
    files:
      - name: media
        label: 'Media settings'
        file: project/site/src/data/site.json
        format: json
        fields:
          - name: hero
            label: 'Hero photo (top of homepage)'
            widget: object
            fields:
              - { name: photo, label: 'Hero photo', widget: image, hint: 'Full-bleed background of the hero. Use a high-resolution landscape photo.' }
          - name: about
            label: 'About section (video block)'
            widget: object
            fields:
              - { name: video, label: 'About video', widget: file, hint: 'MP4 only, ideally H.264, no audio, under 10 MB. Use ffmpeg to compress.' }
              - { name: poster, label: 'About video poster (thumbnail before play)', widget: image }
          - name: trustStrip
            label: 'Trust strip'
            widget: object
            fields:
              - { name: ownerPhoto, label: 'Owner avatar', widget: image }
          - name: gallery
            label: 'Gallery'
            widget: object
            fields:
              - name: items
                label: 'Gallery items (order = display order)'
                widget: list
                summary: '{{fields.id}}'
                hint: 'IDs must match the captions list in Site copy.'
                fields:
                  - { name: id, label: 'Photo ID (e.g. marazul-12)', widget: string }
                  - { name: src, label: 'Photo file', widget: image }
                  - { name: span, label: 'Layout span', widget: select, options: ['', 'wide', 'tall', 'wide tall'], default: '', hint: 'Empty for normal size. "wide tall" makes the photo a feature tile (only use once).' }
