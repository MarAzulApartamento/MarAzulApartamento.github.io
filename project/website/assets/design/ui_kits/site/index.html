<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Apartamento Mar Azul · Lagos, Algarve</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root" data-screen-label="01 Homepage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [lang, setLang] = useState("en");
  const [route, setRoute] = useState("home");
  const [tiles, setTiles] = useState([]);
  const [tileIndex, setTileIndex] = useState(-1);
  const [topScrolled, setTopScrolled] = useState(false);
  const [heroPassed, setHeroPassed] = useState(false);
  const [footerVisible, setFooterVisible] = useState(false);
  const currentTile = tileIndex >= 0 ? tiles[tileIndex] : null;
  const showSticky = !footerVisible && route === "home" && heroPassed;

  useEffect(() => {
    function onScroll() {
      const y = window.scrollY;
      setTopScrolled(y > 8);
      setHeroPassed(y > 600);
    }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Hide the sticky CTA bar when the footer enters the viewport,
  // so it doesn't visually overlap the footer content.
  useEffect(() => {
    const footer = document.querySelector(".footer");
    if (!footer) return;
    const obs = new IntersectionObserver(
      ([entry]) => setFooterVisible(entry.isIntersecting),
      { threshold: 0 }
    );
    obs.observe(footer);
    return () => obs.disconnect();
  }, [route]);

  const goBook = () => { setRoute("book"); window.scrollTo(0, 0); };
  const goHome = () => { setRoute("home"); window.scrollTo(0, 0); };
  const goAvailability = () => {
    if (route !== "home") {
      setRoute("home");
      // Wait for home to render before scrolling
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.getElementById("availability")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    } else {
      document.getElementById("availability")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  };
  const openTile = (list, idx) => { setTiles(list); setTileIndex(idx); };
  const closeTile = () => setTileIndex(-1);
  const prevTile = () => setTileIndex((i) => Math.max(0, i - 1));
  const nextTile = () => setTileIndex((i) => Math.min(tiles.length - 1, i + 1));

  return (
    <>
      <TopBar lang={lang} setLang={setLang} scrolled={topScrolled} />
      {route === "home" ? (
        <main data-screen-label="01 Homepage">
          <Hero onAvailability={goAvailability} />
          <TrustStrip />
          <FactsGrid />
          <About />
          <Gallery onOpen={openTile} />
          <Perks />
          <Location />
          <Reviews />
          <Availability onContinue={goBook} />
          <FAQ />
          <FinalCTA onAvailability={goAvailability} />
        </main>
      ) : (
        <main data-screen-label="02 Book">
          <BookPage onBack={goHome} />
        </main>
      )}
      <Footer />
      <StickyCTA visible={showSticky} onBook={goBook} />
      <Lightbox
        tile={currentTile}
        onClose={closeTile}
        onPrev={prevTile}
        onNext={nextTile}
        hasPrev={tileIndex > 0}
        hasNext={tileIndex >= 0 && tileIndex < tiles.length - 1}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
