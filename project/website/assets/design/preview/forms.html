<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body);color:var(--fg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font:600 13px/1 var(--font-body);color:var(--fg)}
  .hint{font:400 12.5px/1.4 var(--font-body);color:var(--fg-muted)}
  input,select{font:400 16px/1.2 var(--font-body);color:var(--fg);background:var(--warm-white);border:1px solid var(--border-strong);border-radius:8px;padding:12px 14px;width:100%}
  input::placeholder{color:var(--fg-muted)}
  input:focus,select:focus{outline:2px solid var(--atlantic-blue);outline-offset:2px;border-color:var(--atlantic-blue)}
  .focused{outline:2px solid var(--atlantic-blue);outline-offset:2px;border-color:var(--atlantic-blue)}
</style></head>
<body class="dsx">
  <div class="grid">
    <div class="field"><label for="a">Check-in</label><input id="a" type="text" value="Sat, 14 Jun"></div>
    <div class="field"><label for="b">Check-out</label><input id="b" type="text" value="Sat, 21 Jun" class="focused"></div>
    <div class="field"><label for="c">Guests</label><select id="c"><option>2 adults</option><option>2 adults · 1 child</option></select></div>
    <div class="field"><label for="d">Email</label><input id="d" type="email" placeholder="you@example.com"><span class="hint">We may answer within 12 hours.</span></div>
  </div>
</body></html>
