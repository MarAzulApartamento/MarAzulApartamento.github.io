<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:var(--bg)}
  .specimen{max-width:560px}
  .eyebrow{font:600 13px/1 var(--font-body);letter-spacing:0.06em;color:var(--fg-muted);margin:0 0 10px}
  h2{font:700 36px/1.1 var(--font-display);letter-spacing:-0.01em;color:var(--fg);margin:0 0 14px;text-wrap:balance}
  p{font:400 16px/1.6 var(--font-body);color:var(--fg);margin:0 0 8px;max-width:60ch}
  .muted{color:var(--fg-muted);font-size:14px}
</style></head>
<body class="dsx">
  <div class="specimen">
    <div class="eyebrow">Lagos · Algarve</div>
    <h2>A quiet apartment for couples and small families.</h2>
    <p>Walking distance from the centre and the beaches. Sleeps 2 to 4, with a terrace that catches a glimpse of the Atlantic in the late afternoon.</p>
    <p class="muted">Spectral 700 paired with Manrope 400. Display reserved for 24 px and above.</p>
  </div>
</body></html>
