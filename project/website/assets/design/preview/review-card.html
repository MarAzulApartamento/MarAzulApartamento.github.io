<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Review card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-body);color:var(--fg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--warm-white);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .name{font:600 14px/1 var(--font-body);color:var(--fg)}
  .date{font:400 13px/1 var(--font-body);color:var(--fg-muted)}
  .stars{display:inline-flex;gap:2px;margin-bottom:8px}
  .star{width:14px;height:14px}
  .quote{font:italic 400 17px/1.45 var(--font-display);color:var(--fg);margin:0;text-wrap:pretty}
</style></head>
<body class="dsx">
