<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FAQ accordion</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-body);color:var(--fg)}
  .item{border-bottom:1px solid var(--border);padding:14px 0}
  .item:first-child{border-top:1px solid var(--border)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}
  .q{font:600 16px/1.3 var(--font-body);color:var(--fg);margin:0}
  .chev{width:14px;height:14px;border-right:1.5px solid var(--fg);border-bottom:1.5px solid var(--fg);transform:rotate(45deg);transition:transform 220ms cubic-bezier(0.22,1,0.36,1);flex:0 0 auto}
  .open .chev{transform:rotate(225deg)}
  .panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms cubic-bezier(0.22,1,0.36,1)}
  .open .panel{grid-template-rows:1fr}
  .panel-inner{overflow:hidden}
  .a{font:400 15px/1.6 var(--font-body);color:var(--fg-muted);margin:8px 0 4px;max-width:60ch}
</style></head>
<body class="dsx">
  <div class="item open"><div class="row"><h4 class="q">Where do I get the keys?</h4><span class="chev"></span></div>
    <div class="panel"><div class="panel-inner"><p class="a">A self check-in lockbox by the front door. We send the code the day before arrival, with a short video walking you to the building.</p></div></div></div>
  <div class="item"><div class="row"><h4 class="q">Is parking included?</h4><span class="chev"></span></div></div>
  <div class="item"><div class="row"><h4 class="q">Is the apartment baby friendly?</h4><span class="chev"></span></div></div>
  <div class="item"><div class="row"><h4 class="q">What is the cancellation policy?</h4><span class="chev"></span></div></div>
</body></html>
