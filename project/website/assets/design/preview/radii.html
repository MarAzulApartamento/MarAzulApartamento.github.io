<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:var(--bg)}
  .row{display:flex;gap:18px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:80px;height:80px;background:var(--seafoam);border:1px solid var(--border-strong)}
  .lbl{font:600 12px/1.2 var(--font-body);color:var(--fg);text-align:center}
  .px{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)}
</style></head>
<body class="dsx">
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">r-sm</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl">r-md</div><div class="px">8</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="lbl">r-lg</div><div class="px">14</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="lbl">r-xl</div><div class="px">20</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="lbl">r-pill</div><div class="px">∞</div></div>
  </div>
</body></html>
