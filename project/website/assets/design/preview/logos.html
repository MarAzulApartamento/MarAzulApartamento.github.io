<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:var(--bg);font-family:var(--font-body)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)}
  .cell{padding:24px;display:flex;align-items:center;justify-content:center;min-height:120px}
  .a{background:var(--warm-white)}
  .b{background:var(--seafoam)}
  .c{background:var(--atlantic-blue)}
  img{height:48px;max-width:100%}
  .lbl{position:absolute;font:600 11px/1 var(--font-body);letter-spacing:0.06em;color:var(--fg-muted);margin-top:-78px}
  .lbl.dark{color:rgba(248,246,241,0.7)}
</style></head>
<body class="dsx">
  <div class="row">
    <div class="cell a"><img src="../assets/logo-primary.svg" alt="primary"></div>
    <div class="cell b"><img src="../assets/logo-monochrome.svg" alt="monochrome"></div>
    <div class="cell c"><img src="../assets/logo-reversed.svg" alt="reversed"></div>
  </div>
</body></html>
