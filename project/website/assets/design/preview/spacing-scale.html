<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--bg);font-family:var(--font-body);color:var(--fg)}
  .row{display:flex;align-items:center;gap:14px;padding:6px 0}
  .tok{flex:0 0 60px;font:600 12px/1 var(--font-body);letter-spacing:0.04em;color:var(--fg-muted)}
  .px{flex:0 0 50px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg-muted)}
  .bar{height:14px;background:var(--atlantic-blue);border-radius:2px}
</style></head>
<body class="dsx">
  <div class="row"><div class="tok">s-1</div><div class="px">4</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="tok">s-2</div><div class="px">8</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="tok">s-3</div><div class="px">12</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="tok">s-4</div><div class="px">16</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="tok">s-6</div><div class="px">24</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="tok">s-8</div><div class="px">32</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="tok">s-12</div><div class="px">48</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="tok">s-16</div><div class="px">64</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="tok">s-20</div><div class="px">80</div><div class="bar" style="width:80px"></div></div>
  <div class="row"><div class="tok">s-24</div><div class="px">96</div><div class="bar" style="width:96px"></div></div>
</body></html>
